name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Unit tests
        run: node --test

      - name: Playtest QA
        run: npm run playtest

      - name: Browser smoke
        run: npm run browser:smoke

      - name: Balance simulation
        run: npm run simulate -- --runs 1000 --seed 20260731 --difficulty normal

      - name: Release package
        run: npm run release

      - name: Package Pages site
        run: npm run pages:package

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

